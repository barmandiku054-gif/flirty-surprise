<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrostatics Formula Puzzle Pro</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Formula Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- JS Confetti for Success Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #05050A;
            --bg-panel: rgba(25, 25, 35, 0.6);
            --text-main: #FFFFFF;
            --text-muted: #8E8E9F;
            --accent-cyan: #00E5FF;
            --accent-pink: #FF0055;
            --accent-gold: #FFD700;
            --accent-green: #00FF88;
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Ambient Background */
        #ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.08) 0%, transparent 50%);
            filter: blur(60px);
            transition: background 1s ease;
        }

        /* Glassmorphism */
        .glass {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Layout */
        #sidebar {
            width: 320px; height: 100%; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            border-right: 1px solid var(--glass-border);
            overflow-y: auto; z-index: 10;
        }

        #main-content {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            overflow-y: auto; scroll-behavior: smooth; position: relative;
        }

        /* Topbar */
        #topbar {
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10;
        }

        .btn {
            background: var(--glass-border); color: #fff; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: var(--accent-cyan); color: #000; border: none; }
        .btn-primary:hover { background: #00b3cc; box-shadow: 0 0 15px var(--accent-cyan); }
        .btn-success { background: var(--accent-green); color: #000; border: none; }
        .btn-success:hover { box-shadow: 0 0 15px var(--accent-green); }

        /* Sidebar Topics */
        .topic-btn {
            background: transparent; border: none; color: var(--text-muted);
            text-align: left; padding: 12px 16px; border-radius: 8px; cursor: pointer;
            font-family: var(--font-main); font-size: 0.9rem; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .topic-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .topic-btn.active {
            background: rgba(0, 229, 255, 0.1); color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
        }
        .topic-btn.solved { color: var(--accent-green); }

        /* Puzzle Area */
        #hero-section {
            padding: 40px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 500px; position: relative;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.3; pointer-events: none;
        }

        #title { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; z-index: 1; text-align: center; }
        #meaning { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; z-index: 1; text-align: center;}

        /* Dropzone & Bank */
        .puzzle-container {
            width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; z-index: 1;
        }
        .dropzone {
            min-height: 100px; padding: 20px; border: 2px dashed var(--glass-border);
            border-radius: 16px; display: flex; flex-wrap: wrap; gap: 15px;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .dropzone.success { border-color: var(--accent-green); background: rgba(0, 255, 136, 0.05); }
        .dropzone.error { border-color: var(--accent-pink); background: rgba(255, 0, 85, 0.05); }

        .bank {
            min-height: 80px; padding: 20px; display: flex; flex-wrap: wrap; gap: 15px;
            align-items: center; justify-content: center;
        }

        /* Puzzle Pieces */
        .piece {
            padding: 15px 25px; border-radius: 12px; cursor: pointer;
            background: rgba(25, 25, 35, 0.9); border: 1px solid rgba(255,255,255,0.2);
            font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); user-select: none;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .piece:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.3); border-color: var(--accent-cyan); }
        .piece:active { transform: scale(0.95); }
        
        .katex-display { margin: 0 !important; }

        /* Action Buttons */
        .puzzle-actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; z-index: 1; }

        /* Details Grid (Hidden initially) */
        #details-grid {
            display: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; padding: 40px; opacity: 0;
        }

        .card { padding: 24px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: var(--accent-gold); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .var-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
        .var-sym { color: var(--accent-cyan); font-family: var(--font-mono); font-weight: bold; }
        
        /* Progress Bar */
        #progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
        #progress-bar { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.3s ease; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="ambient-bg"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="glass">
        <h2 style="font-weight:800; color:var(--accent-cyan); font-size:1.5rem; margin-bottom:10px;">⚡ PuzzlePro</h2>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;" id="progress-text">0/29 Solved</p>
        <input type="text" id="search" placeholder="Search topic..." style="width:100%; padding:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.05); color:#fff; margin-bottom:10px; font-family:var(--font-main);">
        <div id="topic-list"></div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div id="topbar">
            <div>
                <button class="btn" onclick="prevTopic()">← Prev</button>
                <button class="btn" onclick="nextTopic()">Next →</button>
            </div>
            <div>
                <span style="color:var(--text-muted); font-size:0.9rem; margin-right:15px;" id="status-badge">Solve to unlock info</span>
                <button class="btn btn-primary" onclick="showHint()" id="hint-btn">💡 Hint</button>
            </div>
        </div>

        <!-- Hero: Puzzle Area -->
        <div id="hero-section">
            <canvas id="physics-canvas"></canvas>
            <h1 id="title" class="gsap-anim">Loading...</h1>
            <p id="meaning" class="gsap-anim">...</p>
            
            <div class="puzzle-container gsap-anim">
                <div class="dropzone" id="dropzone"></div>
                <div class="bank" id="bank"></div>
            </div>

            <div class="puzzle-actions gsap-anim">
                <button class="btn" onclick="resetPuzzle()">↺ Reset</button>
                <button class="btn btn-success" onclick="checkAnswer()" id="check-btn">✔ Check Answer</button>
            </div>
        </div>

        <!-- Details Grid (Unlocks after solving) -->
        <div id="details-grid" class="grid-layout">
            <div class="card glass">
                <h3>Variables</h3>
                <div id="variables-list"></div>
            </div>
            <div class="card glass">
                <h3>Physical Quantities</h3>
                <p><strong>SI Unit:</strong> <span id="si-unit" style="color:var(--accent-cyan)"></span></p>
                <p><strong>Dimensions:</strong> <span id="dimensions" style="font-family:var(--font-mono)"></span></p>
            </div>
            <div class="card glass">
                <h3>NEET / JEE Shortcut</h3>
                <p id="shortcut" style="color:var(--accent-pink); font-weight:600;"></p>
            </div>
            <div class="card glass">
                <h3>Memory Trick</h3>
                <p id="memory-trick" style="font-style:italic;"></p>
            </div>
            <div class="card glass">
                <h3>Important Notes</h3>
                <ul id="notes" style="padding-left:20px; color:var(--text-muted);"></ul>
            </div>
            <div class="card glass">
                <h3>Common Mistakes</h3>
                <p id="mistakes" style="color:#ff5555;"></p>
            </div>
        </div>
    </div>

<script>
/**
 * PUZZLE ENGINE DATASET
 * Re-engineered from static formulas into dynamic puzzle components.
 */
const topics = [
    {
        id: 1, title: "Coulomb's Law", 
        meaning: "Electrostatic force between two stationary point charges.",
        puzzle: {
            parts: ["F", "=", "\\frac{1}{4\\pi\\epsilon_0}", "\\frac{q_1 q_2}{r^2}"],
            distractors: ["\\frac{q_1}{r}", "r^3"]
        },
        vars: [{s: "F", d: "Force"}, {s: "q_1, q_2", d: "Charges"}, {s: "r", d: "Distance"}, {s: "\\epsilon_0", d: "Permittivity"}],
        unit: "Newton (N)", dim: "[M L T^{-2}]",
        shortcut: "F ∝ 1/r². If distance is halved, force becomes 4 times.",
        memory: "Force falls fast! (r squared in bottom)",
        mistakes: "Forgetting to square the distance 'r'.",
        notes: ["Central force.", "Obeys Newton's 3rd Law."],
        viz: "coulomb"
    },
    {
        id: 2, title: "Force in Medium",
        meaning: "Force is reduced when charges are placed in a dielectric medium.",
        puzzle: {
            parts: ["F_m", "=", "\\frac{F_{vacuum}}{K}"],
            distractors: ["K \\cdot F_{vacuum}", "\\epsilon_0"]
        },
        vars: [{s: "K", d: "Dielectric constant"}, {s: "\\epsilon", d: "Permittivity of medium"}],
        unit: "Newton (N)", dim: "[M L T^{-2}]",
        shortcut: "Force in water (K≈80) is 80 times weaker than in air.",
        memory: "Medium mitigates the force (divide by K).",
        mistakes: "Multiplying by K instead of dividing.",
        notes: ["K for air = 1", "K for metals = ∞"],
        viz: "medium"
    },
    {
        id: 3, title: "Coulomb's Law (Vector)",
        meaning: "Specifies direction of force along with magnitude.",
        puzzle: {
            parts: ["\\vec{F}_{12}", "=", "\\frac{1}{4\\pi\\epsilon_0}", "\\frac{q_1 q_2}{r^3}", "\\vec{r}_{12}"],
            distractors: ["\\frac{q_1 q_2}{r^2}", "\\hat{r}_{21}"]
        },
        vars: [{s: "\\vec{F}_{12}", d: "Force on 1 due to 2"}, {s: "\\vec{r}_{12}", d: "Position vector"}],
        unit: "Newton (N)", dim: "[M L T^{-2}]",
        shortcut: "Notice r³ below because \\vec{r} above adds an 'r' magnitude.",
        memory: "Vector needs a full arrow and r³ below.",
        mistakes: "Using r² when using the full position vector \\vec{r}.",
        notes: ["\\vec{F}_{12} = -\\vec{F}_{21}"],
        viz: "vector"
    },
    {
        id: 4, title: "Electric Field Definition",
        meaning: "Force experienced per unit positive test charge.",
        puzzle: {
            parts: ["\\vec{E}", "=", "\\frac{\\vec{F}}{q_0}"],
            distractors: ["\\vec{F} \\cdot q_0", "r^2"]
        },
        vars: [{s: "\\vec{E}", d: "Electric Field"}, {s: "\\vec{F}", d: "Force"}, {s: "q_0", d: "Test charge"}],
        unit: "N/C or V/m", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "F = qE. Just like W = mg in gravity.",
        memory: "E is the Environment that pushes the charge.",
        mistakes: "Assuming test charge q0 modifies the field.",
        notes: ["Vector quantity.", "Direction is same as force on a positive charge."],
        viz: "field"
    },
    {
        id: 5, title: "E-Field: Point Charge",
        meaning: "Field created by a single source charge 'q' at distance 'r'.",
        puzzle: {
            parts: ["E", "=", "\\frac{1}{4\\pi\\epsilon_0}", "\\frac{q}{r^2}"],
            distractors: ["\\frac{q}{r}", "q_1 q_2"]
        },
        vars: [{s: "E", d: "Electric Field"}, {s: "q", d: "Source charge"}, {s: "r", d: "Distance"}],
        unit: "N/C", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "Inverse square law (1/r²).",
        memory: "Same as Coulomb's, just drop one 'q'.",
        mistakes: "Confusing source charge 'q' with test charge 'q0'.",
        notes: ["Radially outward for +q", "Radially inward for -q"],
        viz: "point_charge"
    },
    {
        id: 6, title: "Superposition of E-Fields",
        meaning: "Total field is the vector sum of individual fields.",
        puzzle: {
            parts: ["\\vec{E}_{net}", "=", "\\sum_{i=1}^{n}", "\\vec{E}_i"],
            distractors: ["\\prod_{i=1}^{n}", "E_1 \\times E_2"]
        },
        vars: [{s: "\\vec{E}_{net}", d: "Total Field"}],
        unit: "N/C", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "For symmetric setups with equal charges, E_net = 0.",
        memory: "Superposition = Super Vector Addition",
        mistakes: "Adding magnitudes directly instead of vectors.",
        notes: ["Requires vector resolution."],
        viz: "superposition"
    },
    {
        id: 7, title: "Electric Field Lines",
        meaning: "Number of field lines is proportional to charge magnitude.",
        puzzle: {
            parts: ["N", "\\propto", "|q|"],
            distractors: ["=", "\\frac{1}{q}"]
        },
        vars: [{s: "N", d: "Number of lines"}, {s: "q", d: "Charge"}],
        unit: "Dimensionless", dim: "None",
        shortcut: "Denser lines = Stronger field.",
        memory: "Lines flow from Positive to Negative.",
        mistakes: "Drawing field lines forming closed loops.",
        notes: ["Tangent gives field direction."],
        viz: "lines"
    },
    {
        id: 8, title: "Electric Dipole",
        meaning: "Two equal and opposite charges separated by a small distance.",
        puzzle: {
            parts: ["+q", "\\xleftarrow{2a}", "-q"],
            distractors: ["+q \\dots +q", "a"]
        },
        vars: [{s: "+q, -q", d: "Charges"}, {s: "2a", d: "Separation"}],
        unit: "Conceptual", dim: "None",
        shortcut: "Treat the center as the origin for math.",
        memory: "Di-pole = Two poles.",
        mistakes: "Taking distance as 'a' instead of '2a'.",
        notes: ["Net charge is zero.", "Net field is NOT zero."],
        viz: "dipole_sys"
    },
    {
        id: 9, title: "Dipole Moment",
        meaning: "Measure of the strength of the dipole.",
        puzzle: {
            parts: ["\\vec{p}", "=", "q", "\\times", "2\\vec{a}"],
            distractors: ["q \\times a", "\\frac{q}{2a}"]
        },
        vars: [{s: "\\vec{p}", d: "Dipole Moment"}, {s: "2\\vec{a}", d: "Vector from -q to +q"}],
        unit: "C·m", dim: "[L T A]",
        shortcut: "Direction is Negative to Positive (- to +).",
        memory: "p = q × dist.",
        mistakes: "Assuming direction is + to - (that's E-field).",
        notes: ["Vector quantity."],
        viz: "dipole_moment"
    },
    {
        id: 10, title: "Electric Potential",
        meaning: "Work done in bringing a unit charge from infinity.",
        puzzle: {
            parts: ["V", "=", "\\frac{W}{q}"],
            distractors: ["W \\times q", "\\frac{q}{W}"]
        },
        vars: [{s: "V", d: "Potential"}, {s: "W", d: "Work done"}, {s: "q", d: "Charge"}],
        unit: "Volt (V)", dim: "[M L^2 T^{-3} A^{-1}]",
        shortcut: "1 Volt = 1 Joule per Coulomb.",
        memory: "Voltage is the Work per charge.",
        mistakes: "Treating potential as a vector.",
        notes: ["Scalar quantity.", "V at infinity is 0."],
        viz: "potential"
    },
    {
        id: 11, title: "V due to Point Charge",
        meaning: "Potential created by charge q at distance r.",
        puzzle: {
            parts: ["V", "=", "\\frac{1}{4\\pi\\epsilon_0}", "\\frac{q}{r}"],
            distractors: ["\\frac{q}{r^2}", "r^2"]
        },
        vars: [{s: "V", d: "Potential"}, {s: "r", d: "Distance"}],
        unit: "Volt (V)", dim: "[M L^2 T^{-3} A^{-1}]",
        shortcut: "V ∝ 1/r. Keep the sign of q!",
        memory: "V has one 'r' in the denominator.",
        mistakes: "Forgetting the negative sign for negative charges.",
        notes: ["Scalar addition for multiple charges."],
        viz: "point_charge"
    },
    {
        id: 12, title: "Potential Energy",
        meaning: "Energy stored in a system of charges.",
        puzzle: {
            parts: ["U", "=", "\\frac{1}{4\\pi\\epsilon_0}", "\\frac{q_1 q_2}{r}"],
            distractors: ["\\frac{q_1 q_2}{r^2}", "E"]
        },
        vars: [{s: "U", d: "Potential Energy"}],
        unit: "Joule (J)", dim: "[M L^2 T^{-2}]",
        shortcut: "Like charges = positive U (repulsion).",
        memory: "U = q * V",
        mistakes: "Not multiplying signs of charges.",
        notes: ["Scalar quantity."],
        viz: "coulomb"
    },
    {
        id: 13, title: "Potential Gradient",
        meaning: "Relation between Electric Field and Potential.",
        puzzle: {
            parts: ["E", "=", "-", "\\frac{dV}{dr}"],
            distractors: ["+", "\\frac{dr}{dV}"]
        },
        vars: [{s: "E", d: "Electric field"}, {s: "dV/dr", d: "Potential gradient"}],
        unit: "V/m", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "Electric field points to DECREASING potential.",
        memory: "E is the negative slope of V.",
        mistakes: "Forgetting the negative sign.",
        notes: ["E is perpendicular to equipotential lines."],
        viz: "gradient"
    },
    {
        id: 14, title: "Equipotential Surface Work",
        meaning: "Work done moving a charge on an equipotential surface.",
        puzzle: {
            parts: ["W", "=", "q \\Delta V", "=", "0"],
            distractors: ["q V", "\\infty"]
        },
        vars: [{s: "W", d: "Work"}, {s: "\\Delta V", d: "Potential Difference = 0"}],
        unit: "Joule (J)", dim: "[M L^2 T^{-2}]",
        shortcut: "Always ZERO work.",
        memory: "Equi = Equal, so Delta V = 0.",
        mistakes: "Thinking E=0 on the surface (E is perpendicular, not zero).",
        notes: ["Two equipotential surfaces never intersect."],
        viz: "equipotential"
    },
    {
        id: 15, title: "Electric Flux",
        meaning: "Field lines passing normally through an area.",
        puzzle: {
            parts: ["\\Phi_E", "=", "\\vec{E} \\cdot \\vec{A}", "=", "E A \\cos\\theta"],
            distractors: ["E A \\sin\\theta", "\\vec{E} \\times \\vec{A}"]
        },
        vars: [{s: "\\Phi_E", d: "Flux"}, {s: "\\vec{A}", d: "Area vector"}],
        unit: "N·m²/C", dim: "[M L^3 T^{-3} A^{-1}]",
        shortcut: "Area vector is normal to the surface.",
        memory: "Dot product uses cosine.",
        mistakes: "Using sine instead of cosine.",
        notes: ["Scalar quantity."],
        viz: "flux"
    },
    {
        id: 16, title: "Gauss's Law",
        meaning: "Total net flux equals enclosed charge over ε0.",
        puzzle: {
            parts: ["\\oint \\vec{E} \\cdot d\\vec{A}", "=", "\\frac{q_{enclosed}}{\\epsilon_0}"],
            distractors: ["q_{total}", "\\epsilon_0 q_{enclosed}"]
        },
        vars: [{s: "q_{enclosed}", d: "Charge INSIDE surface"}],
        unit: "N·m²/C", dim: "[M L^3 T^{-3} A^{-1}]",
        shortcut: "Outside charges contribute ZERO to net flux.",
        memory: "Flux out = Stuff inside / ε0.",
        mistakes: "Using total charge instead of enclosed.",
        notes: ["True for any closed surface."],
        viz: "gauss"
    },
    {
        id: 17, title: "E-Field: Infinite Line",
        meaning: "Field by an infinitely long straight charged wire.",
        puzzle: {
            parts: ["E", "=", "\\frac{\\lambda}{2\\pi\\epsilon_0 r}"],
            distractors: ["\\frac{\\lambda}{4\\pi\\epsilon_0 r^2}", "\\sigma"]
        },
        vars: [{s: "\\lambda", d: "Linear charge density (C/m)"}],
        unit: "N/C", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "Drops off as 1/r, NOT 1/r².",
        memory: "Line is 1D, so r is power 1.",
        mistakes: "Using inverse square law.",
        notes: ["Derived using cylindrical Gaussian surface."],
        viz: "line_charge"
    },
    {
        id: 18, title: "E-Field: Infinite Sheet",
        meaning: "Field generated by a thin infinite sheet.",
        puzzle: {
            parts: ["E", "=", "\\frac{\\sigma}{2\\epsilon_0}"],
            distractors: ["\\frac{\\sigma}{\\epsilon_0}", "r"]
        },
        vars: [{s: "\\sigma", d: "Surface charge density"}],
        unit: "N/C", dim: "[M L T^{-3} A^{-1}]",
        shortcut: "Field is UNIFORM. Does not depend on 'r'.",
        memory: "Infinite sheet, infinite reach (no 'r').",
        mistakes: "Adding 'r' to the formula.",
        notes: ["For thick conductor, E = σ/ε0."],
        viz: "sheet"
    },
    {
        id: 19, title: "E-Field: Hollow Shell (Inside)",
        meaning: "Field inside a hollow charged conductor.",
        puzzle: {
            parts: ["E_{inside}", "=", "0"],

// App State
let currentIndex = 0;
let solvedTopics = new Set();
let correctSequence = [];
let dropzoneItems = [];
let bankItems = [];
let isSolved = false;

// DOM Elements
const dropzoneEl = document.getElementById('dropzone');
const bankEl = document.getElementById('bank');
const titleEl = document.getElementById('title');
const meaningEl = document.getElementById('meaning');
const detailsGrid = document.getElementById('details-grid');
const canvas = document.getElementById('physics-canvas');
const ctx = canvas.getContext('2d');

function init() {
    renderSidebar();
    loadTopic(0);
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    requestAnimationFrame(animationLoop);
    
    document.getElementById('search').addEventListener('input', (e) => {
        renderSidebar(e.target.value.toLowerCase());
    });
}

function renderSidebar(filter = "") {
    const list = document.getElementById('topic-list');
    list.innerHTML = "";
    topics.forEach((t, i) => {
        if (t.title.toLowerCase().includes(filter)) {
            const btn = document.createElement('button');
            const isSolvedItem = solvedTopics.has(i);
            btn.className = `topic-btn ${i === currentIndex ? 'active' : ''} ${isSolvedItem ? 'solved' : ''}`;
            btn.innerHTML = `<span style="opacity:0.5">${t.id}.</span> ${t.title} ${isSolvedItem ? '✔' : ''}`;
            btn.onclick = () => loadTopic(i);
            list.appendChild(btn);
        }
    });
}

// Utility: Fisher-Yates Shuffle
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function loadTopic(index) {
    if (index < 0 || index >= topics.length) return;
    currentIndex = index;
    const t = topics[index];
    isSolved = solvedTopics.has(index);

    // Hide Details / Reset UI
    gsap.to(detailsGrid, { opacity: 0, duration: 0.3, onComplete: () => {
        detailsGrid.style.display = 'none';
        dropzoneEl.className = 'dropzone'; // Reset colors
        
        titleEl.textContent = t.title;
        meaningEl.textContent = t.meaning;
        
        if(isSolved) {
            document.getElementById('status-badge').textContent = "✅ Mastered";
            document.getElementById('status-badge').style.color = "var(--accent-green)";
            setupPuzzleState(true);
            showDetails(); // Instantly show details if already solved
        } else {
            document.getElementById('status-badge').textContent = "Solve to unlock info";
            document.getElementById('status-badge').style.color = "var(--text-muted)";
            setupPuzzleState(false);
        }
        
        renderSidebar(document.getElementById('search').value);
        setupViz(t.viz);
    }});
}

function setupPuzzleState(preSolved) {
    const t = topics[currentIndex];
    correctSequence = [...t.puzzle.parts];
    
    if (preSolved) {
        dropzoneItems = [...correctSequence];
        bankItems = [];
    } else {
        dropzoneItems = [];
        bankItems = shuffleArray([...t.puzzle.parts, ...t.puzzle.distractors]);
    }
    renderPuzzleUI();
}

function renderPuzzleUI() {
    dropzoneEl.innerHTML = "";
    bankEl.innerHTML = "";
    
    dropzoneItems.forEach((part, idx) => {
        const div = document.createElement('div');
        div.className = 'piece';
        katex.render(part, div, { throwOnError: false });
        if(!isSolved) div.onclick = () => movePiece('dropzone', idx);
        dropzoneEl.appendChild(div);
    });

    bankItems.forEach((part, idx) => {
        const div = document.createElement('div');
        div.className = 'piece';
        katex.render(part, div, { throwOnError: false });
        if(!isSolved) div.onclick = () => movePiece('bank', idx);
        bankEl.appendChild(div);
    });
}

function movePiece(from, index) {
    if(isSolved) return;
    
    if (from === 'bank') {
        const item = bankItems.splice(index, 1)[0];
        dropzoneItems.push(item);
    } else {
        const item = dropzoneItems.splice(index, 1)[0];
        bankItems.push(item);
    }
    // Simple fast re-render (GSAP layout animations can be complex in pure DOM, so we snap and scale)
    renderPuzzleUI();
    gsap.from(".piece", {scale: 0.8, opacity: 0.8, duration: 0.2, stagger: 0.02});
}

function resetPuzzle() {
    if(isSolved) return;
    setupPuzzleState(false);
    gsap.from(".piece", {y: 20, opacity: 0, duration: 0.3});
    dropzoneEl.classList.remove('error');
}

function checkAnswer() {
    if(isSolved) return;
    
    const userAns = dropzoneItems.join("");
    const correctAns = correctSequence.join("");
    
    if (userAns === correctAns) {
        // Success
        isSolved = true;
        solvedTopics.add(currentIndex);
        dropzoneEl.classList.add('success');
        
        // Confetti
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#00FF88', '#00E5FF'] });
        
        document.getElementById('status-badge').textContent = "✅ Mastered";
        document.getElementById('status-badge').style.color = "var(--accent-green)";
        updateProgress();
        renderSidebar();
        
        // Remove distractors from bank
        bankItems = [];
        renderPuzzleUI();
        
        showDetails();
    } else {
        // Error
        dropzoneEl.classList.add('error');
        gsap.to(dropzoneEl, {x: -10, duration: 0.1, yoyo: true, repeat: 5, onComplete: () => {
            gsap.to(dropzoneEl, {x: 0});
            setTimeout(() => dropzoneEl.classList.remove('error'), 1000);
        }});
    }
}

function showHint() {
    if(isSolved) return;
    alert("Hint: The first piece should be: " + correctSequence[0]);
}

function showDetails() {
    const t = topics[currentIndex];
    
    document.getElementById('variables-list').innerHTML = t.vars.map(v => 
        `<div class="var-row"><span class="var-sym">${katex.renderToString(v.s)}</span><span>${v.d}</span></div>`
    ).join('');
    
    document.getElementById('si-unit').textContent = t.unit;
    document.getElementById('dimensions').textContent = t.dim;
    document.getElementById('shortcut').textContent = t.shortcut;
    document.getElementById('memory-trick').textContent = t.memory;
    document.getElementById('mistakes').textContent = t.mistakes;
    document.getElementById('notes').innerHTML = t.notes.map(n => `<li style="margin-bottom:5px;">${n}</li>`).join('');

    detailsGrid.style.display = 'grid';
    gsap.to(detailsGrid, { opacity: 1, duration: 0.8, y: -20, ease: "power2.out" });
    
    // Ambient color shift on success
    document.getElementById('ambient-bg').style.background = `radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 60%)`;
    setTimeout(() => {
        document.getElementById('ambient-bg').style.background = `radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.08) 0%, transparent 50%)`;
    }, 2000);
}

function nextTopic() { loadTopic(currentIndex + 1); }
function prevTopic() { loadTopic(currentIndex - 1); }

function updateProgress() {
    const pct = (solvedTopics.size / topics.length) * 100;
    document.getElementById('progress-bar').style.width = pct + "%";
    document.getElementById('progress-text').textContent = `${solvedTopics.size}/${topics.length} Solved`;
}

// ---------------------------------------------------------
// PHYSICS RENDERING ENGINE (Runs in BG)
// Unlocks full vibrancy only when puzzle is solved
// ---------------------------------------------------------
let particles = [];
let currentViz = "";
let time = 0;

function resizeCanvas() {
    canvas.width = document.getElementById('hero-section').clientWidth;
    canvas.height = document.getElementById('hero-section').clientHeight;
}

function setupViz(type) {
    currentViz = type;
    particles = [];
    const cx = canvas.width/2;
    const cy = canvas.height/2;

    if (type === "point_charge" || type === "shell") particles.push({x: cx, y: cy, q: 1, r: 20});
    else if (["coulomb", "vector", "medium", "dipole_sys", "dipole_moment"].includes(type)) {
        particles.push({x: cx - 120, y: cy, q: -1, r: 15});
        particles.push({x: cx + 120, y: cy, q: 1, r: 15});
    }
    else if (["lines", "flux", "gauss"].includes(type)) particles.push({x: cx, y: cy, q: 1, r: 15});
}

function drawCharge(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    // Dim if unsolved, bright if solved
    const alpha = isSolved ? 0.8 : 0.2;
    ctx.fillStyle = p.q > 0 ? `rgba(255, 0, 85, ${alpha})` : `rgba(0, 229, 255, ${alpha})`;
    ctx.shadowBlur = isSolved ? 20 : 0;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = "bold 16px Inter";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.q > 0 ? "+" : "-", p.x, p.y);
}

function animationLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    time += 0.05;
    const cx = canvas.width/2;
    const cy = canvas.height/2;
    const alpha = isSolved ? 0.5 : 0.1; // opacity modifier based on lock state

    if(currentViz === "point_charge" || currentViz === "lines") {
        ctx.strokeStyle = `rgba(0, 229, 255, ${alpha/2})`;
        for(let i=0; i<12; i++) {
            let angle = (i * Math.PI*2/12) + (isSolved ? time*0.1 : 0);
            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle)*300, cy + Math.sin(angle)*300); ctx.stroke();
        }
        particles.forEach(drawCharge);
    }
    else if (currentViz === "coulomb") {
        if(isSolved) {
            particles[0].x = cx - 120 + Math.sin(time)*15;
            particles[1].x = cx + 120 - Math.sin(time)*15;
        }
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.setLineDash([5, 5]); ctx.beginPath();
        ctx.moveTo(particles[0].x, particles[0].y); ctx.lineTo(particles[1].x, particles[1].y);
        ctx.stroke(); ctx.setLineDash([]);
        particles.forEach(drawCharge);
    }
    else if (["capacitor", "density", "pressure", "series", "parallel"].includes(currentViz)) {
        ctx.fillStyle = `rgba(255, 0, 85, ${alpha})`; ctx.fillRect(cx - 200, cy - 80, 400, 20);
        ctx.fillStyle = `rgba(0, 229, 255, ${alpha})`; ctx.fillRect(cx - 200, cy + 60, 400, 20);
        
        if(isSolved) {
            ctx.strokeStyle = `rgba(255,255,255,0.2)`;
            let offset = (time * 20) % 30;
            for(let x = cx - 180; x <= cx + 180; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, cy - 60); ctx.lineTo(x, cy + 60); ctx.stroke();
                let ay = cy - 60 + ((offset + x)%120);
                if(ay < cy + 50 && ay > cy - 50) {
                    ctx.beginPath(); ctx.moveTo(x, ay); ctx.lineTo(x-5, ay-5); ctx.lineTo(x+5, ay-5);
                    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fill();
                }
            }
        }
    }
    else if (currentViz === "gauss") {
        particles.forEach(drawCharge);
        ctx.strokeStyle = `rgba(255, 215, 0, ${alpha})`; 
        ctx.setLineDash([10, 10]); ctx.beginPath();
        ctx.arc(cx, cy, 120 + (isSolved ? Math.sin(time)*10 : 0), 0, Math.PI*2);
        ctx.stroke(); ctx.setLineDash([]);
    }
    else {
        particles.forEach(drawCharge);
        ctx.fillStyle = `rgba(255,255,255,${alpha/2})`;
        for(let i=0; i<8; i++) {
            ctx.beginPath();
            ctx.arc(cx + Math.cos(time+i)*150, cy + Math.sin(time+i)*80, 4, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    requestAnimationFrame(animationLoop);
}

window.onload = init;
